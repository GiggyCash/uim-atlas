plugins {
    id 'java'
}

group = 'com.uimatlas'
version = '0.1.0'

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = '1.12.38'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

test {
    dependsOn tasks.named('jar')
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'pluginJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'testClassesDirectory', layout.buildDirectory.dir('classes/java/test').get().asFile.absolutePath
}

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with UIM Atlas installed as a development plugin.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.uimatlas.UimAtlasDevLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

apply from: 'gradle/source-size.gradle'
